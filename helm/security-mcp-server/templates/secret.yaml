# Optional secret for sensitive data
{{- if and .Values.secret.enabled (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "security-mcp-server.fullname" . }}-secret
  labels:
    {{- include "security-mcp-server.labels" . | nindent 4 }}
type: Opaque
data:
{{- range $k, $v := .Values.secret.data }}
  {{ $k }}: {{ $v | b64enc | quote }}
{{- end }}
{{- end }}

