# Default values for security-mcp-server

replicaCount: 1

image:
  repository: your-registry/security-mcp-server
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: security-mcp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  enabled: true
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 2
  failureThreshold: 3

readinessProbe:
  enabled: true
  path: /ready
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

env:
  - name: LOG_LEVEL
    value: info
extraEnvFrom: []
extraEnv: []

config:
  APP_MODE: production
  ENABLE_FEATURE_X: "false"

secret:
  enabled: true
  data:
    LOG_LEVEL: info
    ALICLOUD_CONFIGS:
      - account_id: "123456"
        access_key_id: "sscaseoiwerw"
        access_key_secret: "zvzxvsdfsfl"
        region_id: "cn-shanghai"
      - account_id: "abcdef"
        access_key_id: "98osiopoi98"
        access_key_secret: "qkomcwkklasd"
        region_id: "cn-beijing"
    JIHULAB_CONFIG:
      url: "https://jihulab.com/api/v4"
      token: "***"
      roche_parent_group: "roche%2Fcommercial-innovation"
    VIRUSTOTAL_CONFIG:
      api_key: "***"
  existingSecret: ""

nodeSelector: {}
tolerations: []
affinity: {}

extraVolumes: []
extraVolumeMounts: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75
